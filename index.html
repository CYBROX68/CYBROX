<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBROX Technology Services, Trading & Bike Rider</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fa;
color:#333;
}

header{
background:#0b63ce;
color:#fff;
padding:20px;
text-align:center;
}

header img{
width:120px;
margin-bottom:10px;
}

header h1{
font-size:38px;
}

header p{
font-size:20px;
margin-top:10px;
}

nav{
background:#084b9a;
padding:15px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:15px;
font-weight:bold;
}

.hero{
padding:80px 20px;
text-align:center;
background:white;
}

.hero h2{
font-size:40px;
color:#0b63ce;
}

.hero p{
font-size:20px;
margin-top:20px;
}

.btn{
display:inline-block;
margin-top:30px;
padding:12px 30px;
background:#0b63ce;
color:white;
text-decoration:none;
border-radius:5px;
}

section{
padding:50px 20px;
max-width:1000px;
margin:auto;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
</body>
</html>
